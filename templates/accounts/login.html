
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CRM HULO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 360px;
            max-width: calc(100% - 40px);
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000015;
        }

        h2 {
            text-align: center;
            color: #1763b1;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1763b1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #104b89;
        }

        .error {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>CRM HULO</h2>
        <p style="text-align:center;">
            Đăng nhập hệ thống
        </p>

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Tên đăng nhập"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Mật khẩu"
                required
            >

            <button type="submit">
                Đăng nhập
            </button>
        </form>
    </div>
</body>
</html>
